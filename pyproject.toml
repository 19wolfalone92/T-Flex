[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tflex-figurines"
version = "0.3.0"
description = "Figurine mesh prep and Tripo v3 API for T-FLEX CAD"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "trimesh>=4.0,<5",
  "networkx>=3.2,<4",
  "requests>=2.31,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tflex-figurines = "tflex_figurines.cli:main"
tflex-tripo = "tflex_figurines.tripo_cli:main"
tflex-studio = "tflex_figurines.studio_cli:main"
tflex-meshy = "tflex_figurines.meshy_cli:main"
tflex-audit = "tflex_figurines.quality:main"
tflex-reference = "tflex_figurines.reference:main"
tflex-contact-sheet = "tflex_figurines.contact_sheet:main"
tflex-pipeline = "tflex_figurines.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
