name: NEW master alternative — Hunyuan3D-2mv (free GPU)
on:
  push:
    branches: [research/new-master-multiview-20261119]
    paths: [.github/workflows/new-master-hunyuan.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SOURCE_URL: 'https://assets.meshy.ai/efb00ba8-043f-4ff5-829b-84a69a233d37/uploads/0_01a1ed78-d307-731f-99e4-04dc78479958.png?Expires=1795132800&Signature=I3sj6d~HsbYgBRkqOo3h4nbcFpCB~jEISWQf9m1IjguJaUnXE-u1nlKZW~nXObNVsxw-J6Ie~d1agJN0D-p0kd7ASLmmPjeF5mMAfx~DFDFGnWOBUyuh1MnxmWbyr-zUkwIuH-akLy97q80WQhXMBuiSf0o-yvRjpsvwrwDAtwjpQoCsJVADQ8hrW5i6Hg8X4EsejqixLQJbssHB4fusNxmpnrp1D86F3zKRqdJIOFI2cGr9bRN6tjJ1YH7WJVwlUU7fDCwr3GnQy4weC~0u~O8~sFCJXeOH6g0rf0itTO5wQzvQXIunZHHcHGm00rX~WF-2UYAzfGT0-4WeXdp8fQ__&Key-Pair-Id=K1VGYTHIYLM9UM'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install only free public reference inference client
        run: python -m pip install "gradio_client>=1.12,<3" requests Pillow "numpy>=1.26" "trimesh>=4.8" "networkx>=3"
      - name: Call real Hunyuan3D-2mv GPU generation (one view, no credits)
        run: python -u scripts/generate_master_hunyuan2mv.py
      - name: Install headless VTK to render real STL
        run: |
          python -m pip install "vtk>=9.4,<10"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libegl1 libosmesa6
      - name: Render actual geometry from all four sides and three-quarter
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' python scripts/preview_new_master.py \
            /tmp/new-master-hunyuan/new_master_hunyuan_150mm_REVIEW_ONLY.stl \
            /tmp/new-master-hunyuan/master_five_angles.png
      - name: Validate 3D file and audit, not quality claims
        run: |
          python - <<'PY'
          import trimesh,json
          from pathlib import Path
          p=Path('/tmp/new-master-hunyuan')
          m=trimesh.load_mesh(p/'new_master_hunyuan_150mm_REVIEW_ONLY.stl')
          d=json.loads((p/'geometry_qa.json').read_text())
          assert len(m.faces)>10000 and abs(m.extents[2]-150)<.3
          assert d['likeness_accepted'] is False
          assert d['print_ready_certified'] is False
          assert (p/'master_five_angles.png').stat().st_size>30000
          print('PASS new master candidate GLB/STL five views; still needs likeness review')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-Hunyuan2mv-master-GLB-STL-views
          path: /tmp/new-master-hunyuan
          retention-days: 30
          if-no-files-found: warn
