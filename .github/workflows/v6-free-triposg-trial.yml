name: V6 independent free TripoSG geometry experiment
on:
  push:
    branches: [research/new-master-multiview-20261119]
    paths: [.github/workflows/v6-free-triposg-trial.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  candidate_3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SOURCE_URL: 'https://assets.meshy.ai/efb00ba8-043f-4ff5-829b-84a69a233d37/uploads/0_01a1ed78-d307-731f-99e4-04dc78479958.png?Expires=1795132800&Signature=I3sj6d~HsbYgBRkqOo3h4nbcFpCB~jEISWQf9m1IjguJaUnXE-u1nlKZW~nXObNVsxw-J6Ie~d1agJN0D-p0kd7ASLmmPjeF5mMAfx~DFDFGnWOBUyuh1MnxmWbyr-zUkwIuH-akLy97q80WQhXMBuiSf0o-yvRjpsvwrwDAtwjpQoCsJVADQ8hrW5i6Hg8X4EsejqixLQJbssHB4fusNxmpnrp1D86F3zKRqdJIOFI2cGr9bRN6tjJ1YH7WJVwlUU7fDCwr3GnQy4weC~0u~O8~sFCJXeOH6g0rf0itTO5wQzvQXIunZHHcHGm00rX~WF-2UYAzfGT0-4WeXdp8fQ__&Key-Pair-Id=K1VGYTHIYLM9UM'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public unbilled inference client and geometry inspector
        run: python -m pip install 'gradio_client>=1.12,<3' requests Pillow 'trimesh>=4.8,<5' 'numpy>=1.26,<3' 'networkx>=3,<4'
      - name: Run ACTUAL free inference; never submit money-using provider API
        run: python -u scripts/try_free_triposg_v6.py
      - name: Preserve any real files (do not fabricate result)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V6_FREE_TRIPOSG_EXPERIMENT_UNVERIFIED
          path: /tmp/triposg-v6-test/
          retention-days: 7
          if-no-files-found: warn
