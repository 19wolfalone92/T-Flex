name: Hi3D 3.0 authentication and balance — READ ONLY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hi3d-connection.yml"

permissions:
  contents: read

jobs:
  balance-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Verify Hi3D AK/SK with Basic auth token then read-only balance
        env:
          HI3D_ACCESS_KEY: ${{ secrets.HI3D_ACCESS_KEY }}
          HI3D_SECRET_KEY: ${{ secrets.HI3D_SECRET_KEY }}
        run: |
          python - <<'PY'
          from tflex_figurines.hi3d import Hi3DClient
          client = Hi3DClient()
          balance = client.balance()
          assert 'totalBalance' in balance, 'Hi3D balance data missing totalBalance'
          print('Hi3D 3.0 authentication and balance check succeeded; no generation or credits spent.')
          PY
