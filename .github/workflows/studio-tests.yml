name: Professional figurine studio test suite

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tests
        run: python -m pip install -e ".[dev]"
      - name: Static python parse
        run: python -m compileall -q src tests scripts
      - name: Run offline tests (never bills API credits)
        run: python -m pytest -q
